<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лаб. №10 · Bash Shell Scripting</title>
<style>:root {
  --fs: 15px;
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface2: #f6f8fa;
  --line: #d9dee4;
  --ink: #17202a;
  --ink2: #4a5663;
  --ink3: #6b7785;
  --accent: #2f6fde;
  --accent-ink: #ffffff;
  --ok: #1e8a4c;
  --ok-bg: #e5f5ec;
  --bad: #c2362f;
  --bad-bg: #fbeceb;
  --warn: #a05a00;
  --warn-bg: #fff4e0;
  --bonus: #7a4fd0;
  --term-bg: #13181e;
  --term-ink: #d6dde5;
  --term-line: #2a323c;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, "DejaVu Sans Mono", "Liberation Mono", Menlo, monospace;
  --sans: "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: var(--fs)/1.45 var(--sans); }
button, input, textarea, select { font: inherit; color: inherit; }
code, pre, kbd { font-family: var(--mono); }
[hidden] { display: none !important; }

#app {
  height: 100vh;
  display: grid;
  grid-template-columns: 250px 1fr;
  grid-template-rows: auto 4px 1fr;
  grid-template-areas: "top top" "prog prog" "side main";
}
.top { grid-area: top; display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.brand small { display: block; color: var(--ink3); font-size: 0.8em; }
.logo { width: 34px; height: 34px; border-radius: 8px; background: var(--term-bg); color: #7ee2a8; display: grid; place-items: center; font: bold 15px var(--mono); }
.who { flex: 1; min-width: 0; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who b { color: var(--ink); }
.stats { display: flex; gap: 18px; }
.stat { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; }
.stat .lbl { font-size: 0.72em; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.04em; }
.stat b { font-size: 1.15em; font-variant-numeric: tabular-nums; }
.stat .bonus { color: var(--bonus); font-weight: 600; font-size: 0.85em; }
#timer.over { color: var(--warn); }
.tools { display: flex; gap: 6px; align-items: center; }
.progress { grid-area: prog; background: var(--line); }
.progress div { height: 100%; width: 0; background: var(--ok); transition: width .3s; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--ink3); }
.btn:focus-visible, .tab:focus-visible, .task-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 600; }
.btn.ghost { background: transparent; }
.btn.icon { padding: 6px 9px; }
.btn.small { padding: 3px 9px; font-size: 0.85em; }
.btn.ghost-dark { background: transparent; color: #aab4bf; border-color: #3a434e; }
.btn.ghost-dark:hover { color: #fff; border-color: #6b7785; }
.btn:disabled { opacity: .5; cursor: default; }

/* ---- боковая панель ---- */
.side { grid-area: side; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 8px 0 16px; }
.sec-title { padding: 12px 16px 4px; font-size: 0.75em; text-transform: uppercase; letter-spacing: .05em; color: var(--ink3); display: flex; justify-content: space-between; }
.task-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; padding: 5px 16px; cursor: pointer; border-left: 3px solid transparent; }
.task-item:hover { background: var(--surface2); }
.task-item.active { background: #e8f0fe; border-left-color: var(--accent); }
.task-item .st { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #b8c1cb; flex: none; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; }
.task-item .st.tried { border-color: var(--warn); background: var(--warn-bg); }
.task-item .st.pass { border-color: var(--ok); background: var(--ok); }
.task-item .st.pass::after { content: "✓"; }
.task-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.92em; }
.task-item .nm i { font-style: normal; color: var(--ink3); font-family: var(--mono); font-size: 0.9em; margin-right: 4px; }
.task-item .pt { font-size: 0.8em; color: var(--ink3); font-variant-numeric: tabular-nums; }
.task-item .pt.b { color: var(--bonus); }
.side-foot { padding: 14px 16px 0; display: grid; gap: 8px; }
.side-foot .btn { width: 100%; }
.legend { font-size: 0.8em; color: var(--ink3); padding: 8px 16px 0; }

/* ---- основная область ---- */
.main { grid-area: main; display: grid; grid-template-columns: minmax(340px, 0.9fr) 1.1fr; min-height: 0; min-width: 0; }
.main.term-only .editor-panel { display: none; }
.main.no-editor .editor-panel { display: none; }
.left { overflow-y: auto; padding: 18px 22px 40px; min-width: 0; }
.right { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--term-bg); border-left: 1px solid var(--line); }
.panel { display: flex; flex-direction: column; min-height: 0; }
.editor-panel { flex: 1.15; border-bottom: 1px solid var(--term-line); }
.console-panel { flex: 1; }
.main.no-editor .console-panel { flex: 1; }
.panel-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #1b2129; color: #aab4bf; font-size: 0.85em; border-bottom: 1px solid var(--term-line); }
.panel-head .file { font-family: var(--mono); color: #e6edf3; }
.panel-head .saved { color: #6fbf8e; font-size: 0.9em; }
.grow { flex: 1; }
.tabs .tab { background: transparent; border: 0; border-bottom: 2px solid transparent; color: #8e99a6; padding: 4px 8px; cursor: pointer; }
.tabs .tab.on { color: #fff; border-bottom-color: #6aa7ff; }

/* ---- редактор ---- */
.code { flex: 1; display: flex; min-height: 0; background: #161b22; overflow: hidden; }
.gutter { flex: none; padding: 10px 8px 10px 10px; text-align: right; color: #56606b; font: var(--fs)/1.5 var(--mono); user-select: none; overflow: hidden; min-width: 44px; white-space: pre; }
.code-area { position: relative; flex: 1; min-width: 0; }
.code-area pre, .code-area textarea { position: absolute; inset: 0; margin: 0; padding: 10px 12px; font: var(--fs)/1.5 var(--mono); white-space: pre; overflow: auto; tab-size: 4; border: 0; }
.code-area pre { color: #d6dde5; pointer-events: none; }
.code-area textarea { background: transparent; color: transparent; caret-color: #fff; resize: none; outline: none; }
.code-area textarea::selection { background: rgba(110, 170, 255, .35); color: transparent; }
.hl .c { color: #7d8b99; font-style: italic; }
.hl .s { color: #a5d6a7; }
.hl .v { color: #f0b46b; }
.hl .k { color: #ff8fb1; font-weight: 600; }
.hl .b { color: #7cc4ff; }
.hl .n { color: #d2a8ff; }
.hl .o { color: #9fb3c8; }

/* ---- консоль / терминал ---- */
.console-body { flex: 1; min-height: 0; position: relative; }
.outview, .term { position: absolute; inset: 0; overflow-y: auto; padding: 10px 12px; font: var(--fs)/1.45 var(--mono); color: var(--term-ink); white-space: pre-wrap; word-break: break-word; }
.term { cursor: text; }
.term-line { display: flex; }
.term-prompt { white-space: pre; }
.term-in { flex: 1; min-width: 40px; background: transparent; border: 0; outline: none; color: var(--term-ink); font: inherit; padding: 0; caret-color: #7ee2a8; }
.outview .cmdline { color: #8ea1b5; }
.outview .exit { color: #8ea1b5; font-size: 0.9em; }
.outview .exit.bad { color: #ff9a8f; }
.outview .muted { color: #6b7785; }
.a-b { font-weight: 700; } .a-i { font-style: italic; } .a-u { text-decoration: underline; }
.a-30 { color: #4b5563; } .a-31 { color: #ff7b72; } .a-32 { color: #7ee787; } .a-33 { color: #e3b341; } .a-34 { color: #79c0ff; } .a-35 { color: #d2a8ff; } .a-36 { color: #76e3ea; } .a-37 { color: #e6edf3; }
.a-90 { color: #8b949e; } .a-91 { color: #ffa198; } .a-92 { color: #56d364; } .a-93 { color: #f8e3a1; } .a-94 { color: #a5d6ff; } .a-95 { color: #e2c5ff; } .a-96 { color: #b3f0ff; } .a-97 { color: #ffffff; }
.a-40 { background: #4b5563; } .a-41 { background: #b62324; } .a-42 { background: #1a7f37; color: #000; } .a-43 { background: #9a6700; } .a-44 { background: #0b4fa8; } .a-45 { background: #8250df; } .a-46 { background: #1b7c83; } .a-47 { background: #d0d7de; color: #000; }
.p-user { color: #7ee787; font-weight: 700; } .p-path { color: #79c0ff; font-weight: 700; }

/* ---- карточка задания ---- */
.task-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.badge { font: 600 0.85em var(--mono); background: var(--ink); color: #fff; padding: 2px 7px; border-radius: 5px; flex: none; margin-top: 3px; }
.task-head h1 { font-size: 1.3em; margin: 0; line-height: 1.25; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
.chip { font-size: 0.8em; padding: 2px 8px; border-radius: 99px; background: var(--surface2); border: 1px solid var(--line); color: var(--ink2); }
.chip.b { color: var(--bonus); border-color: #d9cdf5; background: #f4effd; }
.chip.ok { color: var(--ok); border-color: #bfe3cd; background: var(--ok-bg); }
.chip.warn { color: var(--warn); border-color: #f1d6a8; background: var(--warn-bg); }
.desc p { margin: 0 0 10px; }
.desc ul, .desc ol { margin: 0 0 10px; padding-left: 22px; }
.desc li { margin: 2px 0; }
.desc code, .left code { background: #eef1f5; border: 1px solid #e0e5ea; padding: 0 4px; border-radius: 4px; font-size: 0.92em; }
pre.ex { background: var(--term-bg); color: var(--term-ink); padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 0.92em; margin: 0 0 12px; line-height: 1.45; }
.ex-p { color: #7ee787; } .ex-c { color: #fff; }
table.t { border-collapse: collapse; margin: 0 0 12px; font-size: 0.92em; }
table.t td { border: 1px solid var(--line); padding: 4px 10px; }
details.hint { margin: 4px 0 12px; background: #fff8e6; border: 1px solid #f3dfae; border-radius: 8px; padding: 6px 12px; }
details.hint summary { cursor: pointer; color: var(--warn); font-weight: 600; }
details.hint p { margin: 6px 0 2px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 14px 0; }
.box h3 { margin: 0 0 8px; font-size: 1em; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.field { display: grid; gap: 4px; margin-bottom: 10px; }
.field label { font-size: 0.88em; color: var(--ink2); }
.inp { border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; background: #fff; width: 100%; }
.inp.mono { font-family: var(--mono); }
.inp:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
textarea.inp { resize: vertical; min-height: 56px; }
.runbar { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; }
.runbar label { font-size: 0.88em; color: var(--ink2); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.kbd { font-size: 0.78em; color: var(--ink3); }

/* результаты проверки */
.result { border-radius: 10px; padding: 10px 14px; margin: 14px 0; border: 1px solid; }
.result.ok { background: var(--ok-bg); border-color: #bfe3cd; }
.result.bad { background: var(--bad-bg); border-color: #f0c9c6; }
.result h3 { margin: 0 0 6px; font-size: 1.02em; }
.result.ok h3 { color: var(--ok); }
.result.bad h3 { color: var(--bad); }
.checks { list-style: none; padding: 0; margin: 0; }
.checks li { padding: 2px 0 2px 24px; position: relative; }
.checks li::before { position: absolute; left: 2px; font-weight: 700; }
.checks li.ok::before { content: "✓"; color: var(--ok); }
.checks li.bad::before { content: "✗"; color: var(--bad); }
.test { border-top: 1px solid rgba(0,0,0,.08); padding: 8px 0; }
.test:first-of-type { border-top: 0; }
.test .tt { display: flex; gap: 8px; align-items: baseline; }
.test .tt b.ok { color: var(--ok); } .test .tt b.bad { color: var(--bad); }
.test .cmd { font-family: var(--mono); font-size: 0.88em; color: var(--ink2); word-break: break-all; }
.diff { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
.diff.one { grid-template-columns: 1fr; }
.diff div > span { font-size: 0.75em; color: var(--ink3); text-transform: uppercase; letter-spacing: .04em; }
.diff pre { margin: 2px 0 0; background: var(--term-bg); color: var(--term-ink); padding: 6px 8px; border-radius: 6px; font-size: 0.85em; overflow-x: auto; min-height: 1.6em; }
.diff pre .dl { background: rgba(255, 120, 110, .22); display: inline-block; min-width: 100%; }
.quiz-code { background: var(--term-bg); color: var(--term-ink); padding: 12px 14px; border-radius: 8px; font: 1em/1.5 var(--mono); margin: 0 0 12px; white-space: pre-wrap; }
.opts { display: grid; gap: 8px; margin: 8px 0; }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt input { margin-top: 4px; }
.opt.sel { border-color: var(--accent); background: #eef4ff; }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt code { background: none; border: 0; }
.nav { display: flex; justify-content: space-between; margin-top: 22px; }
.note { font-size: 0.88em; color: var(--ink3); }

/* ---- модальные окна ---- */
.modal-back { position: fixed; inset: 0; background: rgba(15, 20, 26, .55); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--surface); border-radius: 14px; max-width: 640px; width: 100%; max-height: calc(100vh - 32px); overflow-y: auto; padding: 24px 26px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal.wide { max-width: 1100px; }
.modal h2 { margin: 0 0 6px; font-size: 1.4em; }
.modal .sub { color: var(--ink2); margin: 0 0 16px; }
.steps { margin: 0 0 18px; padding-left: 20px; color: var(--ink2); }
.steps li { margin: 4px 0; }
.start-logo { width: 54px; height: 54px; border-radius: 12px; background: var(--term-bg); color: #7ee2a8; display: grid; place-items: center; font: bold 22px var(--mono); margin-bottom: 12px; }
.linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; font-size: 0.9em; }
.warnbox { background: var(--warn-bg); border: 1px solid #f1d6a8; color: #6b3d00; border-radius: 8px; padding: 8px 12px; margin: 0 0 14px; font-size: 0.92em; }
.sumtable { width: 100%; border-collapse: collapse; font-size: 0.9em; margin: 10px 0; }
.sumtable th, .sumtable td { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: left; }
.sumtable th { font-size: 0.8em; color: var(--ink3); text-transform: uppercase; letter-spacing: .03em; }
.sumtable td.num { text-align: right; font-variant-numeric: tabular-nums; }
.sumtable tr.click { cursor: pointer; }
.sumtable tr.click:hover { background: var(--surface2); }
.big-score { font-size: 2.2em; font-weight: 700; }

/* nano */
.nano { position: fixed; inset: 0; z-index: 60; background: var(--term-bg); color: var(--term-ink); display: flex; flex-direction: column; font: var(--fs)/1.5 var(--mono); }
.nano-top { background: #d6dde5; color: #13181e; display: flex; justify-content: space-between; padding: 2px 12px; }
.nano textarea { flex: 1; background: var(--term-bg); color: var(--term-ink); border: 0; outline: none; resize: none; padding: 8px 12px; font: inherit; white-space: pre; tab-size: 4; caret-color: #7ee2a8; }
.nano-msg { min-height: 1.5em; padding: 0 12px; text-align: center; }
.nano-msg.ask { background: #d6dde5; color: #13181e; text-align: left; }
.nano-keys { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 4px 12px 8px; }
.nano-keys button { background: none; border: 0; color: var(--term-ink); cursor: pointer; padding: 0; font: inherit; }
.nano-keys kbd { background: #d6dde5; color: #13181e; padding: 0 3px; margin-right: 4px; }

/* шпаргалка */
.cheat { columns: 2 320px; column-gap: 24px; }
.cheat .cs { break-inside: avoid; margin-bottom: 14px; }
.cheat h4 { margin: 0 0 4px; font-size: 0.95em; color: var(--accent); }
.cheat pre { margin: 0; background: var(--term-bg); color: var(--term-ink); padding: 8px 10px; border-radius: 7px; font-size: 0.85em; white-space: pre-wrap; }

.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 8px; opacity: 0; pointer-events: none; transition: all .2s; z-index: 80; }
.toast.show { opacity: 1; transform: translateX(-50%); }

/* учитель */
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 26px; text-align: center; color: var(--ink2); margin: 12px 0; }
.drop.over { border-color: var(--accent); background: #eef4ff; }
.tag { display: inline-block; font-size: 0.78em; padding: 1px 7px; border-radius: 99px; }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.teacher-detail pre { background: var(--term-bg); color: var(--term-ink); padding: 8px 10px; border-radius: 7px; font-size: 0.85em; overflow-x: auto; white-space: pre; }

@media (max-width: 1100px) {
  .main { grid-template-columns: 1fr; grid-template-rows: auto minmax(560px, 1fr); overflow-y: auto; }
  .left { overflow: visible; }
  .right { min-height: 560px; border-left: 0; }
}
@media (max-width: 760px) {
  #app { grid-template-columns: 1fr; grid-template-rows: auto 4px auto 1fr; grid-template-areas: "top" "prog" "side" "main"; height: auto; min-height: 100vh; }
  .side { max-height: 210px; border-right: 0; border-bottom: 1px solid var(--line); }
  .top { flex-wrap: wrap; }
  .stats { order: 3; }
  .left { padding: 14px 16px 24px; }
  .diff { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<noscript><p style="padding:24px;font:16px sans-serif">Для работы нужен JavaScript. Откройте файл в Chrome, Edge или Firefox.</p></noscript>
<div id="app" hidden>
  <header class="top">
    <div class="brand"><span class="logo">$_</span><div><b>Лаб. №10</b><small>Bash Shell Scripting</small></div></div>
    <div class="who" id="who"></div>
    <div class="stats">
      <div class="stat" title="Время с начала работы"><span class="lbl">Время</span><b id="timer">00:00</b></div>
      <div class="stat" title="Основные баллы из 100 и бонусные"><span class="lbl">Баллы</span><b id="score">0</b><span id="bonus" class="bonus"></span></div>
    </div>
    <div class="tools">
      <button class="btn ghost" id="btnCheat" title="Шпаргалка по синтаксису bash">Шпаргалка</button>
      <button class="btn ghost icon" id="btnZoomOut" title="Уменьшить шрифт">A−</button>
      <button class="btn ghost icon" id="btnZoomIn" title="Увеличить шрифт">A+</button>
      <button class="btn primary" id="btnDownload">Скачать результат</button>
    </div>
  </header>
  <div class="progress"><div id="progressBar"></div></div>
  <aside class="side" id="side"></aside>
  <main class="main" id="main">
    <section class="left" id="left"></section>
    <section class="right" id="right">
      <div class="panel editor-panel" id="editorPanel">
        <div class="panel-head">
          <span class="file" id="editorFile">script.sh</span>
          <span class="saved" id="editorSaved"></span>
          <span class="grow"></span>
          <button class="btn small ghost-dark" id="btnReset" title="Вернуть начальную заготовку">Сбросить</button>
        </div>
        <div class="code" id="codeWrap">
          <div class="gutter" id="gutter"></div>
          <div class="code-area">
            <pre class="hl" id="hl" aria-hidden="true"></pre>
            <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off" aria-label="Редактор скрипта"></textarea>
          </div>
        </div>
      </div>
      <div class="panel console-panel" id="consolePanel">
        <div class="panel-head tabs">
          <button class="tab" data-tab="out" id="tabOut">Вывод скрипта</button>

    expandDollar(raw, i, inDq) {
      const n1 = raw[i + 1];
      if (n1 === '(') {
        if (raw[i + 2] === '(') {
          let e = -1;
          try { e = PU.scanArith(raw, i); } catch (err) { e = -1; }
          if (e > 0) {
            const expr = raw.slice(i + 3, e - 2);
            return { value: String(this.arith(this.expandArithText(expr))), end: e };
          }
        }
        const e = PU.scanCmdSubst(raw, i);
        return { value: this.cmdSubst(raw.slice(i + 2, e - 1)), end: e };
      }
      if (n1 === '{') {
        const e = PU.scanBrace(raw, i);
        const r = this.paramExpand(raw.slice(i + 2, e - 1), inDq);
        r.end = e;
        return r;
      }
      if (n1 === undefined) return null;
      if (n1 === '[') {
        const e = PU.scanOldArith(raw, i);
        return { value: String(this.arith(this.expandArithText(raw.slice(i + 2, e - 1)))), end: e };
      }
      if ('@*#?$!-0123456789_'.indexOf(n1) >= 0) {
        if (n1 === '@' || n1 === '*') {
          const vals = this.positional.slice();
          if (inDq && n1 === '*') return { value: vals.join(this.ifsFirst()), end: i + 2 };
          return { fields: vals, end: i + 2 };
        }
        const v = this.getParam(n1);
        if (v == null && this.opts.nounset && /[1-9]/.test(n1)) throw new ShellError('$' + n1 + ': unbound variable', { fatal: true });
        return { value: v == null ? '' : v, end: i + 2 };
      }
      const m = /^[A-Za-z_][A-Za-z0-9_]*/.exec(raw.slice(i + 1));
      if (m) {
        const v = this.getParam(m[0]);
        if (v == null && this.opts.nounset) throw new ShellError(m[0] + ': unbound variable', { fatal: true });
        return { value: v == null ? '' : v, end: i + 1 + m[0].length };
      }
      return null;
    }
    expandArithText(s) {
      if (s.indexOf('$') < 0 && s.indexOf('`') < 0 && s.indexOf('"') < 0 && s.indexOf('\\') < 0) return s;
      const segs = [];
      this.dqSegments(s, 0, segs, true);
      return segs.map(x => x.brk ? ' ' : x.t).join('').replace(/"/g, '');
    }
    arith(expr) {
      const env = {
        get: (name, idx) => {
          if (idx == null) { const v = this.getParam(name); if (v == null && this.opts.nounset) throw new ShellError(name + ': unbound variable', { fatal: true }); return v; }
          const o = this.getVarObj(name);
          if (!o) return null;
          if (o.map) return o.map.has(String(idx)) ? o.map.get(String(idx)) : null;
          let k = Number(idx);
          if (o.arr) { if (k < 0) { const ks = sortedKeys(o.arr); k = (ks.length ? ks[ks.length - 1] + 1 : 0) + k; } return o.arr.has(k) ? o.arr.get(k) : null; }
          return k === 0 ? o.v : null;
        },
        set: (name, idx, val) => this.setVar(name, idx == null ? null : (typeof idx === 'bigint' ? Number(idx) : idx), val, false),
        isAssoc: (name) => this.isAssocVar(name),
      };
      try {
        return BS.arith.evaluate(expr, env);
      } catch (e) {
        if (e instanceof ArithError) {
          const tok = e.token != null ? e.token : '';
          throw new ShellError(expr.trim() + ': ' + e.message + ' (error token is "' + tok + '")');
        }
        throw e;
      }
    }

    paramExpand(inner, inDq) {
      if (inner === '') throw new ShellError('${}: bad substitution');
      const bad = () => new ShellError('${' + inner + '}: bad substitution');
      // длина
      if (inner[0] === '#' && inner.length > 1) {
        const rest = inner.slice(1);
        let m = /^([A-Za-z_][A-Za-z0-9_]*)\[([@*])\]$/.exec(rest);
        if (m) return { value: String(this.arrayValues(m[1]).length) };
        if (rest === '@' || rest === '*') return { value: String(this.positional.length) };
        m = /^([A-Za-z_][A-Za-z0-9_]*)\[(.+)\]$/.exec(rest);
        if (m) { const v = this.getElem(m[1], m[2]); return { value: String(v == null ? 0 : Array.from(v).length) }; }
        if (/^([A-Za-z_][A-Za-z0-9_]*|[0-9]+|[?$!#\-_])$/.test(rest)) {
          const v = this.getParam(rest);
          if (v == null && this.opts.nounset && rest !== '#') throw new ShellError(rest + ': unbound variable', { fatal: true });
          return { value: String(v == null ? 0 : Array.from(v).length) };
        }
        throw bad();
      }
      // косвенная ссылка / ключи
      if (inner[0] === '!' && inner.length > 1) {
        const rest = inner.slice(1);
        let m = /^([A-Za-z_][A-Za-z0-9_]*)\[([@*])\]$/.exec(rest);
        if (m) {
          const keys = this.arrayKeys(m[1]);
          if (m[2] === '*' && inDq) return { value: keys.join(this.ifsFirst()) };
          return { fields: keys };
        }
        m = /^([A-Za-z_][A-Za-z0-9_]*|[0-9]+|[#@*])([\s\S]*)$/.exec(rest);
        if (m) {
          let ref = m[1] === '#' ? this.getStr('#') : this.getStr(m[1]);
          if (m[1] === '@' || m[1] === '*') ref = this.positional.length ? this.positional[this.positional.length - 1] : '';
          if (m[1] === '#') { const n = this.positional.length; ref = n === 0 ? '0' : String(n); }
          if (ref === '') throw new ShellError(m[1] + ': invalid indirect expansion');
          return this.paramExpand(ref + m[2], inDq);
        }
        throw bad();
      }
      const m = /^([A-Za-z_][A-Za-z0-9_]*|[0-9]+|[@*#?$!\-0_])/.exec(inner);
      if (!m) throw bad();
      const name = m[1];
      let j = name.length;
      let sub = null;
      if (inner[j] === '[' && /^[A-Za-z_]/.test(name)) {
        let depth = 0, k = j;
        for (; k < inner.length; k++) { if (inner[k] === '[') depth++; else if (inner[k] === ']') { depth--; if (depth === 0) break; } }
        if (k >= inner.length) throw bad();
        sub = inner.slice(j + 1, k);
        j = k + 1;
      }
      const op = inner.slice(j);
      // базовое значение
      let arrMode = false, vals = null, val = null, isSet;
      if (name === '@' || name === '*' || sub === '@' || sub === '*') {
        arrMode = true;
        vals = (name === '@' || name === '*') ? this.positional.slice() : this.arrayValues(name);
        isSet = vals.length > 0;
        if (op === '' || /^[:\-=+?]/.test(op)) {
          // для ${arr[@]:-x} проверяется наличие элементов
        }
      } else if (sub != null) {
        val = this.getElem(name, sub);
        isSet = val != null;
      } else {
        val = this.getParam(name);
        isSet = val != null;
      }
      const joinStar = (name === '*' || sub === '*');
      const result = (list) => {
        if (!arrMode) return { value: list };
        if (joinStar && inDq) return { value: list.join(this.ifsFirst()) };
        return { fields: list };
      };
      if (op === '') {
        if (!isSet && this.opts.nounset && !arrMode) throw new ShellError(name + ': unbound variable', { fatal: true });
        return arrMode ? result(vals) : { value: val == null ? '' : val };
      }
      const mm = /^(:?)([-=+?])([\s\S]*)$/.exec(op);
      if (mm) {
        const colon = mm[1] === ':';
        const empty = arrMode ? (vals.length === 0 || (colon && vals.join('') === '')) : (!isSet || (colon && val === ''));
        const wordRaw = mm[3];
        switch (mm[2]) {
          case '-': return empty ? { value: this.expandStr(wordRaw) } : (arrMode ? result(vals) : { value: val });
          case '+': return empty ? { value: '' } : { value: this.expandStr(wordRaw) };
          case '=': {
            if (!empty) return arrMode ? result(vals) : { value: val };
            if (arrMode || /^[0-9@*#?$!\-_]$/.test(name)) throw new ShellError('$' + name + ': cannot assign in this way');
            const w = this.expandStr(wordRaw);
            if (sub != null) this.setVar(name, this.isAssocVar(name) ? this.expandStr(sub) : Number(this.arith(this.expandArithText(sub))), w, false);
            else this.setVar(name, null, w, false);
            return { value: w };
          }
          case '?': {
            if (!empty) return arrMode ? result(vals) : { value: val };
            const msg = wordRaw === '' ? (colon ? 'parameter null or not set' : 'parameter not set') : this.expandStr(wordRaw);
            throw new ShellError(name + ': ' + msg, { fatal: true });
          }
        }
      }
      // подстрока ${x:off:len}
      if (op[0] === ':') {
        const parts = PU.splitTopLevel(op.slice(1), ':');
        if (parts.length > 2) throw bad();
        let off = Number(this.arith(this.expandArithText(parts[0]) || '0'));
        const hasLen = parts.length === 2;
        let len = hasLen ? Number(this.arith(this.expandArithText(parts[1]) || '0')) : null;
        if (arrMode) {
          let list = vals;
          if (name === '@' || name === '*') list = [this.argv0].concat(vals);
          if (off < 0) off = Math.max(list.length + off, list.length + off < 0 ? -1 : 0);
          if (off < 0) return result([]);
          if (name === '@' || name === '*') { if (off === 0 && !hasLen) list = list; }
          let out = list.slice(off);
          if (name !== '@' && name !== '*') out = list.slice(off);
          if (hasLen) { if (len < 0) throw new ShellError(parts[1] + ': substring expression < 0'); out = out.slice(0, len); }
          return result(out);
        }
        const chars = Array.from(val == null ? '' : val);
        if (off < 0) { off = chars.length + off; if (off < 0) return { value: '' }; }
        if (off > chars.length) return { value: '' };
        let endIdx = chars.length;
        if (hasLen) {
          if (len < 0) { endIdx = chars.length + len; if (endIdx < off) throw new ShellError(parts[1].trim() + ': substring expression < 0'); }
          else endIdx = Math.min(chars.length, off + len);
        }
        return { value: chars.slice(off, endIdx).join('') };
      }
      const apply = (fn) => arrMode ? result(vals.map(fn)) : { value: fn(val == null ? '' : val) };
      // удаление префикса/суффикса
      let pm = /^(##|#|%%|%)([\s\S]*)$/.exec(op);
      if (pm) {
        const pat = this.expandPattern(pm[2]);
        const kind = pm[1];
        return apply((s) => {
          const ch = Array.from(s);
          const L = ch.length;
          if (kind === '#') { for (let k = 0; k <= L; k++) if (patMatch(ch.slice(0, k).join(''), pat)) return ch.slice(k).join(''); }
          else if (kind === '##') { for (let k = L; k >= 0; k--) if (patMatch(ch.slice(0, k).join(''), pat)) return ch.slice(k).join(''); }
          else if (kind === '%') { for (let k = L; k >= 0; k--) if (patMatch(ch.slice(k).join(''), pat)) return ch.slice(0, k).join(''); }
          else { for (let k = 0; k <= L; k++) if (patMatch(ch.slice(k).join(''), pat)) return ch.slice(0, k).join(''); }
          return s;
        });
      }
      // замена
      pm = /^\/([\/#%]?)([\s\S]*)$/.exec(op);
      if (pm) {
        const mode = pm[1];
        let body = pm[2];
        // разделить по первому неэкранированному /
        let k = 0, patRaw = body, repRaw = null;
        for (; k < body.length; k++) {
          if (body[k] === '\\') { k++; continue; }
          if (body[k] === "'") { k = PU.scanSingle(body, k) - 1; continue; }
          if (body[k] === '"') { k = PU.scanDouble(body, k) - 1; continue; }
          if (body[k] === '$' && (body[k + 1] === '{' || body[k + 1] === '(')) { k = PU.scanDollar(body, k) - 1; continue; }
          if (body[k] === '/') { patRaw = body.slice(0, k); repRaw = body.slice(k + 1); break; }
        }
        const pat = this.expandPattern(patRaw);
        const rep = repRaw == null ? '' : this.expandStr(repRaw);
        return apply((s) => {
          if (pat === '') return s;
          const ch = Array.from(s);
          const L = ch.length;
          if (mode === '#') { for (let e = L; e >= 0; e--) if (patMatch(ch.slice(0, e).join(''), pat)) return rep + ch.slice(e).join(''); return s; }
          if (mode === '%') { for (let b = 0; b <= L; b++) if (patMatch(ch.slice(b).join(''), pat)) return ch.slice(0, b).join('') + rep; return s; }
          let out = '', a = 0;
          while (a <= L) {
            let found = -1;
            for (let e = L; e >= a; e--) { if (patMatch(ch.slice(a, e).join(''), pat)) { found = e; break; } }
            if (found >= 0 && !(found === a && pat !== '')) {
              out += rep; a = found;
              if (mode !== '/') { out += ch.slice(a).join(''); return out; }
              continue;
            }
            if (found === a) { // пустое совпадение
              if (a < L) out += ch[a];
              a++;
              continue;
            }
            if (a < L) out += ch[a];
            a++;
          }
          return out;
        });
      }
      // регистр
      pm = /^(\^\^|\^|,,|,|~~|~)([\s\S]*)$/.exec(op);
      if (pm) {
        const k = pm[1];
        return apply((s) => {
          if (k === '^^') return s.toUpperCase();
          if (k === ',,') return s.toLowerCase();
          const ch = Array.from(s);
          if (!ch.length) return s;
          if (k === '^') return ch[0].toUpperCase() + ch.slice(1).join('');
          if (k === ',') return ch[0].toLowerCase() + ch.slice(1).join('');
          return Array.from(s).map(c => c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase()).join(k === '~' ? '' : '');
        });
      }
      pm = /^@([QULuEaA])$/.exec(op);
      if (pm) {
        return apply((s) => {
          switch (pm[1]) {
            case 'Q': return shQuote(s) === s && s !== '' ? "'" + s + "'" : shQuote(s);
            case 'U': return s.toUpperCase();
            case 'L': return s.toLowerCase();
            case 'u': return s ? s[0].toUpperCase() + s.slice(1) : s;
            case 'E': return echoEscapes(s).s;
            default: return s;
          }
        });
      }
      throw bad();
    }

    /* Разбиение на поля + glob */
    splitSegs(segs) {
      const ifsV = this.getParam('IFS');
      const ifs = ifsV == null ? ' \t\n' : ifsV;
      const fields = [];
      let cur = null;
      const start = () => { if (!cur) cur = { str: '', pat: '', glob: false }; };
      const end = () => { if (cur) { fields.push(cur); cur = null; } };
      for (const sg of segs) {
        if (sg.brk) { end(); continue; }
        if (sg.q) { start(); cur.str += sg.t; cur.pat += globEscape(sg.t); continue; }
        if (!sg.s || ifs === '') {
          if (sg.t === '' && !sg.s) continue;
          if (sg.t === '' && sg.s) continue;
          start(); cur.str += sg.t; cur.pat += sg.t; if (/[*?[]/.test(sg.t)) cur.glob = true; continue;
        }
        const t = sg.t;
        for (let k = 0; k < t.length; k++) {
          const ch = t[k];
          if (ifs.indexOf(ch) >= 0) {
            const ws = ch === ' ' || ch === '\t' || ch === '\n';
            if (ws) { end(); continue; }
            // не-пробельный разделитель
            if (cur) end(); else fields.push({ str: '', pat: '', glob: false });
            // пропустить пробельные IFS после
            while (k + 1 < t.length && ' \t\n'.indexOf(t[k + 1]) >= 0 && ifs.indexOf(t[k + 1]) >= 0) k++;
            continue;
          }
          start(); cur.str += ch; cur.pat += ch; if (ch === '*' || ch === '?' || ch === '[') cur.glob = true;
        }
      }
      end();
      return fields;
    }
    expandFields(raw) {
      const out = [];
      for (const w of this.braceExpand(raw)) {
        const fields = this.splitSegs(this.segments(w));
        for (const f of fields) {
          if (f.glob && !this.opts.noglob && hasGlob(f.pat)) {
            const m = this.glob(f.pat);
            if (m.length) { for (const x of m) out.push(x); continue; }
          }
          out.push(f.str);
        }
      }
      return out;
    }
    expandStr(raw) {
      if (raw === '') return '';
      return this.segments(raw).map(s => s.brk ? ' ' : s.t).join('');
    }
    expandPattern(raw) {
      return this.segments(raw).map(s => s.brk ? ' ' : (s.q ? globEscape(s.t) : s.t)).join('');
    }
    expandRegex(raw) {
      return this.segments(raw).map(s => s.brk ? ' ' : (s.q ? s.t.replace(/[\\^$.*+?()[\]{}|\/]/g, '\\$&') : s.t)).join('');
    }
    expandHeredoc(body) {
      const segs = [];
      this.dqSegments(body, 0, segs, true);
      return segs.map(s => s.brk ? ' ' : s.t).join('');
    }
    glob(pat) {
      const abs = pat.startsWith('/');
      const parts = pat.split('/');
      let bases = [{ path: abs ? '/' : this.cwd, shown: abs ? '/' : '' }];
      const start = abs ? 1 : 0;
      for (let pi = start; pi < parts.length; pi++) {
        const part = parts[pi];
        const last = pi === parts.length - 1;
        if (part === '') { if (last) bases = bases.map(b => ({ path: b.path, shown: b.shown.endsWith('/') ? b.shown : b.shown + '/' })); continue; }
        const next = [];
        for (const b of bases) {
          const node = this.fs.get(b.path);
          if (!node || node.t !== 'd') continue;
          if (hasGlob(part)) {
            const re = globToRe(part);
            const names = Object.keys(node.c).sort(BS.cmpNames);
            const all = part.startsWith('.') || part.startsWith('\\.') ? ['.', '..'].concat(names) : names;
            for (const nm of all) {
              if (nm.startsWith('.') && !(part.startsWith('.') || part.startsWith('\\.'))) continue;
              if (!re.test(nm)) continue;
              const child = nm === '.' || nm === '..' ? null : node.c[nm];
              if (!last && child && child.t !== 'd') continue;
              next.push({ path: VFS.normalize(nm, b.path), shown: (b.shown && !b.shown.endsWith('/') ? b.shown + '/' : b.shown) + nm });
            }
          } else {
            const nm = unescapeGlob(part);
            const p = VFS.normalize(nm, b.path);
            if (nm === '.' || nm === '..' || this.fs.exists(p)) next.push({ path: p, shown: (b.shown && !b.shown.endsWith('/') ? b.shown + '/' : b.shown) + nm });
          }
        }
        bases = next;
        if (!bases.length) break;
      }
      return bases.map(b => b.shown).sort(BS.cmpNames);
    }

    /* Подстановка команды $( ) */
    parseCached(text) {
      let ast = this.parseCache.get(text);
      if (!ast) {
        try { ast = new Parser(text).parseProgram(); }
        catch (e) { if (e instanceof ParseError) throw new ShellError(e.message.replace('unexpected end of file', "unexpected EOF while looking for matching `)'")); throw e; }
        if (this.parseCache.size > 500) this.parseCache.clear();
        this.parseCache.set(text, ast);
      }
      return ast;
    }
    cmdSubst(text) {
      const ast = this.parseCached(text);
      const sub = this.fork();
      sub.traceLevel = (this.traceLevel || 1) + 1;
      const out = new OutBuf(false);
      const io = { in: this.curIn || EMPTY_IN(), out, err: this.curErr || new NullOut() };
      let st = 0;
      try { st = sub.run(ast, io); }
      catch (e) {
        if (e instanceof ExitSig) st = e.code;
        else if (e instanceof ShellError) { sub.reportError(e, io); st = e.status; }
        else if (e instanceof BreakSig || e instanceof ReturnSig) st = 0;
        else throw e;
      }
      this.lastSubst = st;
      this.status = st;
      return out.s.replace(/\n+$/, '');
    }

    /* ---------- Процессы ---------- */
    fork() {
      const c = Object.create(Shell.prototype);
      Object.assign(c, this);
      c.scopes = this.scopes.map(m => { const n = new Map(); for (const [k, v] of m) n.set(k, cloneVar(v)); return n; });
      c.functions = new Map(this.functions);
      c.aliases = new Map(this.aliases);
      c.positional = this.positional.slice();
      c.opts = Object.assign({}, this.opts);
      c.funcStack = this.funcStack.slice();
      c.subLevel = this.subLevel + 1;
      c.rootPid = this.rootPid || this.pid;
      c.pid = ++pidCounter;
      return c;
    }
    spawn(argv0, args) {
      const env = {};
      for (let i = 0; i < this.scopes.length; i++) for (const [k, v] of this.scopes[i]) if (v.ex && v.v != null) env[k] = v.v;
      env.PWD = this.cwd;
      const c = new Shell({ fs: this.fs, cwd: this.cwd, env, limits: this.limits, execLog: this.execLog, host: this.host, argv0, args, history: [] });
      c.interactive = false;
      c.opts.expand_aliases = false;
      c.ttyStdin = this.ttyStdin;
      return c;
    }

    errPrefix() {
      if (this.interactive && !this.srcName) return 'bash: ';
      return (this.srcName || this.argv0) + ': line ' + this.lineno + ': ';
    }
    errMsg(io, msg) { (io || {}).err && io.err.write(this.errPrefix() + msg + '\n'); }
    reportError(e, io) {
      const err = (io && io.err) || this.curErr;
      if (!err) return;
      err.write((e.noPrefix ? '' : this.errPrefix()) + e.message + '\n');
    }

    /* Выполнение текста программы по командам верхнего уровня */
    runText(src, io, o) {
      o = o || {};
      const p = new Parser(src);
      p.interactive = !!o.interactive;
      let status = 0;
      for (;;) {
        let node;
        try { node = p.parseNextTopLevel(); }
        catch (e) {
          if (!(e instanceof ParseError)) throw e;
          this.lineno = p.lineOf(e.pos);
          if (e.message.indexOf('unexpected end of file') >= 0) this.lineno = (src.match(/\n/g) || []).length + (src.endsWith('\n') ? 1 : 1);
          const pre = this.interactive && !this.srcName ? 'bash: ' : this.errPrefix();
          io.err.write(pre + e.message + '\n');
          if (e.token && !(this.interactive && !this.srcName)) {
            const lines = src.split('\n');
            io.err.write(pre + '`' + (lines[this.lineno - 1] || '').trim() + "'\n");
          }
          status = 2; this.status = 2;
          break;
        }
        if (!node) break;
        this.lineno = node.line;
        try {
          status = this.run(node, io);
        } catch (e) {
          if (e instanceof ShellError) {
            this.reportError(e, io);
            status = e.status; this.status = status;
            if (e.fatal && !this.interactive) throw new ExitSig(status);
            continue;
          }
          if (e instanceof ReturnSig) {
            if (this.sourceDepth > 0 || this.funcStack.length) throw e;
            this.errMsg(io, "return: can only `return' from a function or sourced script");
            status = 1; this.status = 1; continue;
          }
          if (e instanceof BreakSig) { continue; }
          throw e;
        }
      }
      return status;
    }
    evalText(text, io, guard) {
      let ast;
      try { ast = new Parser(text).parseProgram(); }
      catch (e) {
        if (e instanceof ParseError) { this.errMsg(io, e.message); return 2; }
        throw e;
      }
      const saved = this.aliasGuard;
      if (guard) this.aliasGuard = guard;
      try { return this.run(ast, io); } finally { this.aliasGuard = saved; }
    }

    run(node, io) {
      let st;
      switch (node.type) {
        case 'list': {
          st = 0;
          for (const it of node.items) st = this.run(it.node, io);
          return st;
        }
        case 'andor': {
          this.errexitOff++;
          let l;
          try { l = this.run(node.left, io); } finally { this.errexitOff--; }
          if (node.op === '&&' ? l === 0 : l !== 0) return this.run(node.right, io);
          return l;
        }
        case 'pipeline': st = this.execPipeline(node, io); break;
        case 'cmd': st = this.execCmd(node, io); break;
        default:
          st = node.redirs && node.redirs.length ? this.withRedirs(node.redirs, io, (io2) => this.execCompound(node, io2)) : this.execCompound(node, io);
          this.status = st;
          return st;
      }
      this.status = st;
      if (st !== 0 && this.opts.errexit && this.errexitOff === 0) throw new ExitSig(st);
      return st;
    }
    execCompound(node, io) {
      switch (node.type) {
        case 'if': {
          for (const c of node.clauses) {
            this.errexitOff++;
            let cs;
            try { cs = this.run(c.cond, io); } finally { this.errexitOff--; }
            if (cs === 0) return this.run(c.body, io);
          }
          if (node.elseBody) return this.run(node.elseBody, io);
          return 0;
        }
        case 'for': {
          let words;
          if (node.words == null) words = this.positional.slice();
          else { words = []; for (const w of node.words) for (const f of this.expandFields(w)) words.push(f); }
          let st = 0;
          this.loopDepth++;
          try {
            for (const w of words) {
              this.tick();
              if (this.opts.xtrace) io.err.write(this.tracePfx() + 'for ' + node.name + ' in ' + (node.words == null ? '"$@"' : node.words.join(' ')) + '\n');
              this.setVar(node.name, null, w, false);
              try { st = this.run(node.body, io); }
              catch (e) {
                if (e instanceof BreakSig) { if (e.n > 1) { e.n--; throw e; } if (e.cont) continue; st = 0; break; }
                throw e;
              }
            }
          } finally { this.loopDepth--; }
          return st;
        }
        case 'forarith': {
          let st = 0;
          this.loopDepth++;
          try {
            const tr = (e) => { if (this.opts.xtrace) io.err.write(this.tracePfx() + '(( ' + this.expandArithText(e).trim() + ' ))\n'); };
            if (node.init.trim()) { tr(node.init); this.arith(this.expandArithText(node.init)); }
            for (;;) {
              this.tick();
              if (node.cond.trim()) tr(node.cond);
              if (node.cond.trim() && this.arith(this.expandArithText(node.cond)) === 0n) break;
              try { st = this.run(node.body, io); }
              catch (e) {
                if (e instanceof BreakSig) { if (e.n > 1) { e.n--; throw e; } if (!e.cont) { st = 0; break; } }
                else throw e;
              }
              if (node.step.trim()) { tr(node.step); this.arith(this.expandArithText(node.step)); }
            }
          } finally { this.loopDepth--; }
          return st;
        }
        case 'while': {
          let st = 0;
          this.loopDepth++;
          try {
            for (;;) {
              this.tick();
              this.errexitOff++;
              let c;
              try { c = this.run(node.cond, io); } finally { this.errexitOff--; }
              if (node.until ? c === 0 : c !== 0) break;
              try { st = this.run(node.body, io); }
              catch (e) {
                if (e instanceof BreakSig) { if (e.n > 1) { e.n--; throw e; } if (e.cont) continue; st = 0; break; }
                throw e;
              }
            }
          } finally { this.loopDepth--; }
          return st;
        }
        case 'case': {
          this.curIn = io.in; this.curErr = io.err;
          if (this.opts.xtrace) io.err.write(this.tracePfx() + 'case ' + node.word + ' in\n');
          const val = this.expandStr(node.word);
          for (let i = 0; i < node.items.length; i++) {
            const it = node.items[i];
            let hit = false;
            for (const p of it.patterns) { if (patMatch(val, this.expandPattern(p))) { hit = true; break; } }
            if (!hit) continue;
            let st = this.run(it.body, io);
            let j = i;
            while (node.items[j].term === ';&' && j + 1 < node.items.length) { j++; st = this.run(node.items[j].body, io); }
            if (node.items[j].term === ';;&') { i = j; continue; }
            return st;
          }
          return 0;
        }
        case 'group': return this.run(node.body, io);
        case 'subshell': {
          const sub = this.fork();
          try { return sub.run(node.body, io); }
          catch (e) {
            if (e instanceof ExitSig) return e.code;
            if (e instanceof ShellError) { sub.reportError(e, io); return e.status; }
            throw e;
          }
        }
        case 'funcdef': {
          if (KEYWORDS.has(node.name) || /^[0-9]/.test(node.name) || /[$`'"\\=]/.test(node.name)) { this.errMsg(io, '`' + node.name + "': not a valid identifier"); return 1; }
          this.functions.set(node.name, { body: node.body, text: node.text });
          return 0;
        }
        case 'arith': {
          this.curIn = io.in; this.curErr = io.err;
          if (this.opts.xtrace) io.err.write(this.tracePfx() + '(( ' + this.expandArithText(node.expr).trim() + ' ))\n');
          return this.arith(this.expandArithText(node.expr)) !== 0n ? 0 : 1;
        }
        case 'cond': {
          this.curIn = io.in; this.curErr = io.err;
          try { return this.evalCond(node.expr, io) ? 0 : 1; }
          catch (e) { if (e && e.condStatus) return e.condStatus; throw e; }
        }
      }
      throw new FatalError('unknown node ' + node.type);
    }

    evalCond(e, io) {
      switch (e.op) {
        case 'and': return this.evalCond(e.l, io) && this.evalCond(e.r, io);
        case 'or': return this.evalCond(e.l, io) || this.evalCond(e.r, io);
        case 'not': return !this.evalCond(e.e, io);
        case 'str': { const v = this.expandStr(e.w); if (this.opts.xtrace) this.curErr.write(this.tracePfx() + '[[ -n ' + shQuote(v) + ' ]]\n'); return v !== ''; }
        case 'unary': {
          const a = this.expandStr(e.a);
          if (this.opts.xtrace) this.curErr.write(this.tracePfx() + '[[ ' + e.o + ' ' + shQuote(a) + ' ]]\n');
          if (e.o === '-z') return a === '';
          if (e.o === '-n') return a !== '';
          if (e.o === '-v') { const m = /^([A-Za-z_][A-Za-z0-9_]*)(?:\[(.*)\])?$/.exec(a); if (!m) return false; if (m[2] != null) return this.getElem(m[1], m[2]) != null; return this.isSetVar(m[1]); }
          return this.fileTest(e.o, a);
        }
        case 'bin': {
          const l = this.expandStr(e.l);
          if (this.opts.xtrace) this.curErr.write(this.tracePfx() + '[[ ' + shQuote(l) + ' ' + e.o + ' ' + (e.o === '=~' ? this.expandRegex(e.r) : (e.o === '==' || e.o === '=' || e.o === '!=') ? this.expandPattern(e.r) : shQuote(this.expandStr(e.r))) + ' ]]\n');
          switch (e.o) {
            case '==': case '=': return patMatch(l, this.expandPattern(e.r));
            case '!=': return !patMatch(l, this.expandPattern(e.r));
            case '<': return l < this.expandStr(e.r);
            case '>': return l > this.expandStr(e.r);
            case '=~': {
              const src = this.expandRegex(e.r);
              let re;
              try { re = new RegExp(posixToJs(src, false)); }
              catch (err) { const x = new Error('regex'); x.condStatus = 2; throw x; }
              const m = re.exec(l);
              const o = this.varForWrite('BASH_REMATCH');
              o.v = null; o.map = null; o.arr = new Map();
              if (!m) return false;
              m.forEach((g, k) => o.arr.set(k, g == null ? '' : g));
              return true;
            }
            case '-eq': case '-ne': case '-lt': case '-le': case '-gt': case '-ge': {
              const a = this.arith(this.expandArithText(e.l) || '0'), b = this.arith(this.expandArithText(e.r) || '0');
              return { '-eq': a === b, '-ne': a !== b, '-lt': a < b, '-le': a <= b, '-gt': a > b, '-ge': a >= b }[e.o];
            }
            case '-nt': case '-ot': case '-ef': {
              const r = this.expandStr(e.r);
              const A = this.fs.get(this.resolve(l)), B = this.fs.get(this.resolve(r));
              if (e.o === '-ef') return !!A && A === B;
              if (e.o === '-nt') return !!A && (!B || A.mt > B.mt);
              return !!B && (!A || A.mt < B.mt);
            }
          }
        }
      }
      return false;
    }
    resolve(p) { return VFS.normalize(p, this.cwd); }
    fileTest(op, path) {
      if (path === '') return false;
      const n = this.fs.get(this.resolve(path));
      switch (op) {
        case '-e': case '-a': return !!n;
        case '-f': return !!n && n.t === 'f';
        case '-d': return !!n && n.t === 'd';
        case '-s': return !!n && (n.t === 'd' || (n.x || '').length > 0);
        case '-r': return !!n && this.fs.can(n, 'r');
        case '-w': return !!n && this.fs.can(n, 'w');
        case '-x': return !!n && this.fs.can(n, 'x');
        case '-c': return !!n && n.t === 'c';
        case '-O': return !!n && n.o === this.user;
        case '-G': return !!n && n.o === this.user;
        case '-L': case '-h': case '-b': case '-p': case '-S': case '-t': case '-u': case '-g': case '-k': case '-N': return false;
      }
      return false;
    }

    execPipeline(node, io) {
      const n = node.cmds.length;
      let st;
      if (n === 1) st = this.run(node.cmds[0], io);
      else {
        let input = io.in;
        const sts = [];
        for (let i = 0; i < n; i++) {
          const last = i === n - 1;
          const out = last ? io.out : new OutBuf(false);
          const err = (!last && node.errPipe[i]) ? out : io.err;
          const sub = this.fork();
          sub.errexitOff = 0;
          try { st = sub.run(node.cmds[i], { in: input, out, err }); }
          catch (e) {
            if (e instanceof ExitSig) st = e.code;
            else if (e instanceof ShellError) { sub.reportError(e, { err }); st = e.status; }
            else if (e instanceof BreakSig || e instanceof ReturnSig) st = 0;
            else throw e;
          }
          sts.push(st);
          if (!last) input = new InStream(out.s, false);
        }
        if (this.opts.pipefail) { st = 0; for (const s of sts) if (s !== 0) st = s; }
      }
      if (node.bang) st = st === 0 ? 1 : 0;
      return st;
    }

    expandArgs(words) {
      const argv = [];
      const decl = words.length && PU.DECL.has(words[0]);
      for (let i = 0; i < words.length; i++) {
        const w = words[i];
        if (decl && i > 0 && PU.ASSIGN_RE.test(w)) { argv.push({ assignRaw: w }); continue; }
        for (const f of this.expandFields(w)) argv.push(f);
      }
      return argv;
    }

    execCmd(node, io) {
      this.lineno = node.line;
      this.tick();
      // алиасы
      if (this.opts.expand_aliases && node.words.length && node.w0s >= 0) {
        const w0 = node.words[0];
        if (this.aliases.has(w0) && PU.isLiteral(w0) && !(this.aliasGuard && this.aliasGuard.has(w0))) {
          const text = node.text.slice(0, node.w0s) + this.aliases.get(w0) + node.text.slice(node.w0e);
          const guard = new Set(this.aliasGuard || []); guard.add(w0);
          return this.evalText(text, io, guard);
        }
      }
      this.curIn = io.in; this.curErr = io.err;
      this.lastSubst = null;
      const argv = this.expandArgs(node.words);
      if (argv.length === 0) {
        for (const a of node.assigns) {
          if (this.opts.xtrace) io.err.write(this.tracePfx() + this.traceAssign(a) + '\n');
          this.doAssignWord(a);
        }
        let st = this.lastSubst != null ? this.lastSubst : 0;
        if (node.redirs.length) { const r = this.withRedirs(node.redirs, io, () => 0); if (r !== 0) st = r; }
        return st;
      }
      const name = argv[0];
      if (typeof name !== 'string') return 1;
      this.lastArg = typeof argv[argv.length - 1] === 'string' ? argv[argv.length - 1] : '';
      if (this.opts.xtrace) {
        const pre = node.assigns.map(a => this.traceAssign(a));
        io.err.write(this.tracePfx() + pre.concat(argv.map(a => typeof a === 'string' ? shQuote(a) : this.traceAssign(a.assignRaw))).join(' ') + '\n');
      }
      const run = (io2) => {
        if (node.assigns.length) {
          const frame = new Map();
          this.scopes.push(frame);
          try {
            for (const a of node.assigns) { this.doAssignWord(a, frame); const v = frame.get(PU.ASSIGN_RE.exec(a)[1]); if (v) v.ex = true; }
            return this.invoke(argv, io2);
          } finally { const k = this.scopes.indexOf(frame); if (k >= 0) this.scopes.splice(k, 1); }
        }
        return this.invoke(argv, io2);
      };
      if (node.redirs.length) return this.withRedirs(node.redirs, io, run);
      return run(io);
    }
    traceAssign(a) {
      const m = PU.ASSIGN_RE.exec(a);
      const v = a.slice(m[0].length);
      if (!m[2] && v.startsWith('(') && v.endsWith(')')) return a;
      try { return m[0] + shQuote(this.expandStr(v)); } catch (e) { return a; }
    }
    tracePfx() { return '+'.repeat(this.traceLevel || 1) + ' '; }

    invoke(argv, io, noFunc) {
      const name = argv[0];
      if (!noFunc && this.functions.has(name)) return this.callFunction(name, argv.slice(1), io);
      const b = BUILTINS[name];
      if (b) {
        this.curIn = io.in; this.curErr = io.err;
        return b.call(this, argv, io);
      }
      if (name.indexOf('/') >= 0) return this.execFile(name, argv, io);
      const c = BS.COMMANDS && BS.COMMANDS[name];
      if (c) {
        (this.hashed || (this.hashed = new Set())).add(name);
        const strArgs = argv.map(a => typeof a === 'string' ? a : a.assignRaw);
        return c(this, strArgs, io);
      }
      const p = this.findInPath(name);
      if (p) return this.execFile(p, argv, io);
      this.errMsg(io, name + ': command not found');
      this.hintNotFound(argv, io);
      return 127;
    }
    hintNotFound(argv, io) {
      const name = argv[0];
      if (!this.hints) return;
      let h = null;
      if (argv[1] === '=' || (argv[1] && argv[1].startsWith('=')) || name.endsWith('=')) h = 'в присваивании не должно быть пробелов вокруг «=»: имя=значение';
      else if (/^\[[^\s]/.test(name) || /^\[\[[^\s]/.test(name)) h = 'после «[» и перед «]» обязательно нужны пробелы: [ "$a" -gt 5 ]';
      else if (/^(if|while|until)\[/.test(name)) h = 'после if/while ставится пробел: if [ ... ]';
      else if (/\]$/.test(name)) h = 'перед «]» нужен пробел';
      else if (/^\.\//.test(name) === false && this.fs.exists(this.resolve(name)) && this.fs.isFile(this.resolve(name))) h = 'чтобы запустить файл из текущей папки, пишите ./' + name + '  (или bash ' + name + ')';
      else if (name === 'cls') h = 'в Linux экран очищается командой clear';
      else if (name === 'dir') h = 'в Linux содержимое папки показывает ls';
      else if (/^[А-Яа-яЁё]/.test(name)) h = 'похоже, включена русская раскладка клавиатуры';
      if (h) io.err.write('\x1b[33m💡 Подсказка: ' + h + '\x1b[0m\n');
    }
    findInPath(name) {
      const path = this.getStr('PATH').split(':');
      for (const d of path) {
        if (!d) continue;
        const p = VFS.normalize(name, d);
        const n = this.fs.get(p);
        if (n && n.t === 'f' && this.fs.can(n, 'x') && !n.x.startsWith('\x7fELF')) return p;
      }
      return null;
    }
    callFunction(name, args, io) {
      if (this.callDepth >= 300) throw new ShellError(name + ': maximum function nesting level exceeded (300)', { fatal: true });
      const fn = this.functions.get(name);
      const savedPos = this.positional;
      this.positional = args.map(a => typeof a === 'string' ? a : a.assignRaw);
      const frame = new Map();
      this.scopes.push(frame);
      this.funcFrames.push(frame);
      this.funcStack.push(name);
      this.callDepth++;
      const savedLoop = this.loopDepth;
      this.loopDepth = 0;
      let st;
      try { st = this.run(fn.body, io); }
      catch (e) { if (e instanceof ReturnSig) st = e.code; else throw e; }
      finally {
        this.loopDepth = savedLoop;
        this.callDepth--;
        this.funcStack.pop();
        this.funcFrames.pop();
        const k = this.scopes.lastIndexOf(frame);
        if (k >= 0) this.scopes.splice(k, 1);
        this.positional = savedPos;
      }
      this.status = st;
      return st;
    }
    execFile(path, argv, io, how) {
      const abs = this.resolve(path);
      const n = this.fs.get(abs);
      const pre = this.interactive && !this.srcName ? 'bash: ' : this.errPrefix();
      if (!n) {
        io.err.write(pre + path + ': No such file or directory\n');
        if (this.hints && this.interactive) {
          const base = path.split('/').pop();
          if (this.fs.exists(VFS.normalize(base, this.cwd)) === false) io.err.write('\x1b[33m💡 Подсказка: проверьте текущую папку (pwd) и имя файла (ls)\x1b[0m\n');
        }
        return 127;
      }
      if (n.t === 'd') { io.err.write(pre + path + ': Is a directory\n'); return 126; }
      if (!this.fs.can(n, 'x')) {
        io.err.write(pre + path + ': Permission denied\n');
        if (this.hints) io.err.write('\x1b[33m💡 Подсказка: файл не исполняемый — выполните chmod +x ' + path.split('/').pop() + '  (или запустите: bash ' + path + ')\x1b[0m\n');
        return 126;
      }
      const content = n.x;
      if (content.startsWith('\x7fELF')) {
        const base = abs.split('/').pop();
        const c = BS.COMMANDS[base] || BUILTINS[base];
        if (c) return BS.COMMANDS[base] ? c(this, [base].concat(argv.slice(1).map(String)), io) : c.call(this, [base].concat(argv.slice(1)), io);
        io.err.write(pre + path + ': cannot execute binary file\n'); return 126;
      }
      if (content.startsWith('#!')) {
        const line = content.split('\n')[0].slice(2).trim();
        const parts = line.split(/\s+/);
        const interp = parts[0];
        const ip = this.fs.get(VFS.normalize(interp, '/'));
        if (!interp.startsWith('/') || !ip) {
          io.err.write(pre + path + ': cannot execute: required file not found\n');
          if (this.hints) io.err.write('\x1b[33m💡 Подсказка: проверьте первую строку (shebang). Правильно: #!/bin/bash\x1b[0m\n');
          return 127;
        }
        const ib = interp.split('/').pop();
        const real = ib === 'env' ? (parts[1] || '') : ib;
        if (['bash', 'sh', 'dash', 'rbash'].indexOf(real) < 0) {
          io.err.write(pre + path + ': интерпретатор «' + line + '» недоступен в симуляторе (поддерживается только bash)\n');
          return 126;
        }
      }
      return this.runScriptFile(abs, content, path, argv.slice(1).map(a => typeof a === 'string' ? a : a.assignRaw), io, how || 'exec');
    }
    runScriptFile(abs, content, argv0, args, io, how, extraOpts) {
      const child = this.spawn(argv0, args);
      child.hints = this.hints;
      if (extraOpts) Object.assign(child.opts, extraOpts);
      let st;
      try { st = child.runText(content, io, { script: true }); }
      catch (e) {
        if (e instanceof ExitSig) st = e.code;
        else throw e;
      }
      this.execLog.push({ path: abs, how, status: st, args: args.slice(), t: Date.now() });
      return st;
    }
    sourceFile(file, args, io) {
      let abs = null;
      if (file.indexOf('/') >= 0) abs = this.resolve(file);
      else {
        const c = this.resolve(file);
        if (this.fs.isFile(c)) abs = c;
        else { for (const d of this.getStr('PATH').split(':')) { const p = VFS.normalize(file, d || '/'); if (this.fs.isFile(p)) { abs = p; break; } } }
      }
      let content;
      try {
        if (!abs) throw new BS.FsError('ENOENT');
        content = this.fs.readFile(abs);
      } catch (e) {
        this.errMsg(io, file + ': ' + (e.message || 'No such file or directory'));
        return 1;
      }
      const savedPos = this.positional;
      if (args.length) this.positional = args;
      const savedName = this.srcName;
      const savedLine = this.lineno;
      this.srcName = file;
      this.sourceDepth++;
      let st;
      try { st = this.runText(content, io, { script: true }); }
      catch (e) { if (e instanceof ReturnSig) st = e.code; else throw e; }
      finally {
        this.sourceDepth--;
        this.srcName = savedName;
        this.lineno = savedLine;
        if (args.length) this.positional = savedPos;
      }
      this.execLog.push({ path: abs, how: 'source', status: st, args: args.slice(), t: Date.now() });
      return st;
    }

    /* ---------- Перенаправления ---------- */
    withRedirs(redirs, io, fn) {
      const fds = { 0: io.in, 1: io.out, 2: io.err };
      for (const r of redirs) {
        try {

  }

      const s = LC.taskScore(t, state.tasks[t.id]);
      if (t.core) core += s; else bonus += s;
      if (state.tasks[t.id] && state.tasks[t.id].passed) done++;

  }
  function updateHeader() {

  }
  function tickTimer() {

    t.textContent = fmtDur(sec);
    t.classList.toggle('over', sec > LAB.minutes * 60);
  }

  /* ================= Боковая панель ================= */
  function statusOf(t) {
    const s = state.tasks[t.id];

  }

          el('span', { class: 'st ' + st }),
          el('span', { class: 'nm' }, el('i', {}, t.id), t.title),

    }

    side.append(el('div', { class: 'side-foot' },

  /* ================= Экран задания ================= */

  }

  /* ---------- запуск ---------- */
  function runScript(t, args, stdin) {
    flushEditor();
    const view = byId('outView');
    setConsoleTab('out');
    view.textContent = '';
    const cmd = './' + t.file + (args.trim() ? ' ' + args.trim() : '');
    view.append(el('div', { class: 'cmdline' }, 'student@lab10-pc:~/lab10$ ' + cmd + (stdin ? '   ← ввод из поля stdin' : '')));
    const sub = termSh.fork();
    sub.cwd = LABDIR; sub.interactive = false; sub.opts.expand_aliases = false; sub.srcName = null; sub.argv0 = 'bash';
    sub.resetLimits(4000);
    const sink = makeSink(true);
    liveOut = sink;
    let code;
    const io = { in: new BS.io.InStream(stdin, stdin === ''), out: sink.w, err: sink.w };
    const pre = el('div');
    try { code = sub.runText(cmd, io, {}); }
    catch (e) {
      if (e instanceof BS.sig.ExitSig) code = e.code;
      else if (e instanceof BS.sig.FatalError) { sink.w.tty = false; try { sink.w.write(''); } catch (x) { } code = null; ansiAppend(pre, clipLines(sink.get())); view.append(pre); view.append(el('div', { class: 'exit bad' }, e.message === 'output' ? '⛔ Слишком много вывода — скрипт остановлен. Возможно, бесконечный цикл: проверьте, что переменная цикла меняется.' : '⏱ Скрипт остановлен: выполнялся дольше 4 секунд (возможно, бесконечный цикл).')); view.scrollTop = view.scrollHeight; liveOut = null; return; }
      else { code = null; console.error(e); sink.w.write('[внутренняя ошибка симулятора: ' + e.message + ']\n'); }
    }
    liveOut = null;
    ansiAppend(pre, clipLines(sink.get()));
    if (!sink.get()) pre.append(el('span', { class: 'muted' }, '(скрипт ничего не вывел)\n'));
    view.append(pre);
    view.append(el('div', { class: 'exit' + (code ? ' bad' : '') }, '[код завершения: ' + code + ']'));
    view.scrollTop = view.scrollHeight;
    const st = tstate(t.id);
    st.runs = (st.runs || 0) + 1;
    if (!st.touched) { st.touched = true; renderSide(); }
    save();
  }

  /* ---------- проверка ---------- */
  function checkScriptTask(t) {
    flushEditor();
    const code = editor.value;
    const st = tstate(t.id);
    const exp = BS.EXPECTED.tests[t.id];
    const res = LC.checkScript(t, code, exp);
    st.attempts = (st.attempts || 0) + 1;
    st.lastCheckAt = Date.now();
    st.lastCode = code;
    const wasPassed = st.passed;
    if (res.ok) { st.passed = true; st.passCode = code; if (!st.firstPassAt) st.firstPassAt = Date.now(); }
    st.lastResult = { ok: res.ok, n: res.tests.filter(x => x.ok).length, total: res.tests.length, tests: res.tests, reqs: res.reqs, empty: res.empty };
    state.events.push({ t: Date.now(), id: t.id, ok: res.ok });
    renderScriptResult(t, st.lastResult, false);
    if (res.ok && !wasPassed) toast('Задание ' + t.id + ' засчитано: +' + t.points + ' ' + ptsWord(t.points));
    updateHeader(); renderSide(); save();
    const meta = $('.meta'); if (meta && res.ok && !meta.querySelector('.chip.ok')) meta.append(el('span', { class: 'chip ok' }, 'засчитано'));
  }
  function argsShow(a) { return a.map(x => /[\s'"$]/.test(x) || x === '' ? "'" + x + "'" : x).join(' '); }
  function diffPre(text, other) {
    const pre = el('pre');
    const a = (text || '').split('\n'), b = (other == null ? null : other.split('\n'));
    a.forEach((line, i) => {
      const bad = b != null && b[i] !== line;
      pre.append(bad ? el('span', { class: 'dl' }, line === '' ? ' ' : line) : document.createTextNode(line));
      if (i < a.length - 1) pre.append('\n');
    });
    if (text === '') pre.append(el('span', { style: 'color:#6b7785' }, '(пусто)'));
    return pre;
  }
  function renderScriptResult(t, r, restored) {
    const box = byId('resultBox');
    if (!box) return;
    box.textContent = '';
    const st = state.tasks[t.id];
    const head = r.ok ? 'Все тесты пройдены — задание засчитано!' : r.empty ? 'Скрипт пустой — напишите решение.' : 'Пройдено тестов: ' + r.n + ' из ' + r.total;
    const res = el('div', { class: 'result ' + (r.ok ? 'ok' : 'bad') }, el('h3', {}, head));
    if (restored) res.append(el('p', { class: 'note', style: 'margin:0 0 6px' }, 'Результат последней проверки' + (st && st.lastCheckAt ? ' (' + fmtDate(st.lastCheckAt).slice(11) + ')' : '')));
    if (st && st.passed && !r.ok) res.append(el('p', { class: 'note', style: 'margin:0 0 6px;color:#1e8a4c' }, 'Ранее задание уже было засчитано — баллы сохраняются.'));
    if (r.reqs && r.reqs.length) {
      const ul = el('ul', { class: 'checks' });
      for (const q of r.reqs) ul.append(el('li', { class: q.ok ? 'ok' : 'bad' }, 'Требование: ' + q.msg));
      res.append(ul);
    }
    for (const x of r.tests || []) {
      const d = el('div', { class: 'test' });
      const inputDesc = (x.args.length ? argsShow(x.args) : '') + (x.stdin ? '  ← ввод: ' + JSON.stringify(x.stdin).slice(1, -1) : '');
      d.append(el('div', { class: 'tt' }, el('b', { class: x.ok ? 'ok' : 'bad' }, x.ok ? '✓' : '✗'), el('span', {}, 'Тест ' + (x.i + 1) + (x.hidden ? ' (скрытый)' : '')), el('span', { class: 'cmd' }, './' + t.file + ' ' + inputDesc)));
      if (!x.ok) {
        if (x.timeout) d.append(el('p', { class: 'note', style: 'margin:4px 0' }, '⏱ Скрипт выполнялся слишком долго — проверьте условие выхода из цикла.'));
        if (x.outOk && !x.codeOk) d.append(el('p', { class: 'note', style: 'margin:4px 0' }, 'Вывод верный, но код завершения ' + x.gotCode + ' (нужен ' + x.expCode + ').'));
        if (!x.outOk) {

              el('div', {}, el('span', {}, 'Ожидалось'), diffPre(x.expected, null)),
              el('div', {}, el('span', {}, 'Получено'), diffPre(x.got, x.expected))));
          } else {
            d.append(el('div', { class: 'diff one' }, el('div', {}, el('span', {}, 'Получено (сравните с форматом из условия)'), diffPre(x.got, null))));
          }
        }
      }
      res.append(d);
    }
    box.append(res);
  }
  function termCtx(answers) {

  }
  function checkTerminalTask(t) {

    st.attempts = (st.attempts || 0) + 1;
    st.lastCheckAt = Date.now();
    st.lastItems = r.items;
    const was = st.passed;
    if (r.ok) { st.passed = true; st.passItems = r.items; if (!st.firstPassAt) st.firstPassAt = Date.now(); }
    state.events.push({ t: Date.now(), id: t.id, ok: r.ok });
    renderChecklist(r.items, st.passed);
    if (r.ok && !was) toast('Задание ' + t.id + ' засчитано: +' + t.points + ' ' + ptsWord(t.points));

  }
  function renderChecklist(items, passed) {
    const box = byId('resultBox');

    box.append(el('div', { class: 'result ' + (ok ? 'ok' : 'bad') }, el('h3', {}, ok ? 'Всё выполнено — задание засчитано!' : 'Выполнено ' + items.filter(x => x.ok).length + ' из ' + items.length), passed && !ok ? el('p', { class: 'note', style: 'margin:0 0 6px;color:#1e8a4c' }, 'Ранее задание уже было засчитано.') : null, ul));
  }
  function answerQuiz(t, ans) {
    const st = tstate(t.id);

    const r = LC.checkQuiz(t, ans, BS.EXPECTED.quiz[t.id]);
    st.attempts = (st.attempts || 0) + 1;
    st.answer = String(ans);
    state.events.push({ t: Date.now(), id: t.id, ok: r.ok });

    else { st.wrong = (st.wrong || 0) + 1; st.answers = st.answers || {}; (st.wrongAnswers = st.wrongAnswers || []).push(String(ans)); }

  }

  /* ================= Шпаргалка ================= */

  function resultPayload() {

  function parseResultFile(text) {
    const m = /<script type="application\/json" id="lab-result">([\s\S]*?)<\/script>/.exec(text);
    const raw = m ? m[1] : text;
    const p = JSON.parse(raw);
    if (!p || p.lab !== LAB.id) throw new Error('это не файл результата лабораторной №10');
    return p;
  }
  function verifyResult(p) {
    const sigOk = (() => { const c = Object.assign({}, p); const s = c.sig; delete c.sig; return LU.hash(LAB.salt + JSON.stringify(c)) === s; })();
    const vfs = p.term && p.term.fs ? BS.VFS.fromJSON(p.term.fs) : LC.freshFS();
    const ctxBase = { fs: vfs, aliases: new Map((p.term && p.term.aliases) || []), history: (p.term && p.term.history) || [], execLog: (p.term && p.term.execLog) || [] };
    let core = 0, bonus = 0;
    const per = {};
    for (const t of TASKS) {
      const o = p.tasks[t.id] || {};
      let ok = false, note = '';
      if (t.type === 'script') {
        const code = o.passCode || o.code;
        if (code) { const r = LC.checkScript(t, code, BS.EXPECTED.tests[t.id]); ok = r.ok; note = r.tests.filter(x => x.ok).length + '/' + r.tests.length; }
      } else if (t.type === 'terminal') {
        const r = LC.checkTerminal(t, Object.assign({}, ctxBase, { answers: o.answers || {} }));
        ok = r.ok;
        if (!ok && o.passed && o.passItems && o.passItems.every(x => x.ok)) { note = 'засчитано во время работы; в итоговом снимке не подтверждается'; }
      } else {
        ok = !!(o.answer != null && LC.checkQuiz(t, o.answer, BS.EXPECTED.quiz[t.id]).ok);
      }
      let score = 0;
      if (ok) score = (t.type === 'choice' || t.type === 'output') ? Math.round(t.points * Math.max(0, 1 - 0.5 * (o.wrong || 0)) * 10) / 10 : t.points;
      if (t.core) core += score; else bonus += score;
      per[t.id] = { ok, claimed: !!o.passed, score, note };
    }
    const mismatch = TASKS.filter(t => per[t.id].claimed !== per[t.id].ok).map(t => t.id);
    return { sigOk, core: Math.round(core * 10) / 10, bonus: Math.round(bonus * 10) / 10, per, mismatch };
  }
